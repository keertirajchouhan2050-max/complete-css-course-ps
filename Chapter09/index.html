<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            font-family: sans-serif;
            font-size: 40px;
            text-align: center;
            color: red;
        }
        .header{
            width: 700px;
            height: 300px;
            border: 5px solid blue;
            display: flex;
         
            justify-content: space-evenly;

        }
        .box{
            background-color: black;
            color: red;
            padding: 24px;

        }
    </style>
</head>
<body>
    <h1>CSS Flex</h1>
    <hr>
    <div class="header" >

        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
    </div>
</body>
</html>
