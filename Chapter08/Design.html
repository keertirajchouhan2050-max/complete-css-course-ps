<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    h1 {
      font-family: sans-serif;
      text-align: center;
    }
    #a {
      width: 300px;
      height: 300px;
      border-width: 20px;
      border-color: deeppink;
      border-style: solid;
      border-radius: 10px;
      margin: 25px;
      float: left;
    }
    #b {
      width: 300px;
      height: 300px;
      border-width: 20px;
      border-color: deeppink;
      border-style: double;
      border-radius: 10px;
      margin: 25px;
      float: left;
    }
    #c {
      width: 300px;
      height: 300px;
      border-width: 20px;
      border-color: deeppink;
      border-style: ridge;
      border-radius: 10px;
      margin: 25px;
      float: left;
    }

        #d {
      width: 300px;
      height: 300px;
      border-width: 20px;
      border-color: deeppink;
      border-style: groove;
      border-radius: 10px;
      margin: 25px;
      float: left;
    }

    
        #e {
      width: 300px;
      height: 300px;
      border-width: 20px;
      border-color: deeppink;
      border-style: inset;
      border-radius: 10px;
      margin: 25px;
      float: left;
    }

    
        #f {
      width: 300px;
      height: 300px;
      border-width: 20px;
      border-color: deeppink;
      border-style: outset;
      border-radius: 10px;
      margin: 25px;
      float: left;
    }

    
        #g {
      width: 300px;
      height: 300px;
      border-width: 20px;
      border-color: deeppink;
      border-style: dotted;
      border-radius: 10px;
      margin: 25px;
      float: left;
    }

    
        #h {
      width: 300px;
      height: 300px;
      border-width: 20px;
      border-color: deeppink;
      border-style: dashed;
      border-radius: 10px;
      margin: 25px;
      float: left;
    }
button{
    padding-left: 25px;
    padding-right: 25px;
    padding-top: 16px;
    padding-bottom: 16px;
    float: left;
    border-style: none;
    background-color: skyblue;
    border-radius: 4px;
    font-weight: bold;
}
  </style>
  <body>
    <div id="a">
      <h1>Solid</h1>
    </div>
    <div id="b">
      <h1>double</h1>
    </div>
    <div id="c">
      <h1>ridge</h1>
    </div>

        <div id="d">
      <h1>groove</h1>
    </div>
     <div id="e">
      <h1>inset</h1>
    </div>
         <div id="f">
      <h1>outset</h1>
    </div>
         <div id="g">
      <h1>dotted</h1>
    </div>
         <div id="h">
      <h1>dashed</h1>
    </div>
    <button>Click me </button>
  </body>
</html>
