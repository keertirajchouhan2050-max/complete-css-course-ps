<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
    }
    header{
        height: 650px;
        background-color: #eefafa;
        padding-left: 100px;
        padding-right: 100px;
        padding-top: 60px;

    }
    h1{
        color: #0099ff;
        font-size: 150px;
        font-family: sans-serif;
        margin-bottom: 16px;

    }
    p{
        color: #313131;
        font-family: verdana;
        font-size: 16px;
        margin-top: 0;

    }
    #Learn-btn{
        background-color: deeppink;
        border: none;
        padding-top: 14px;
        padding-bottom: 14px;
        padding-left: 24px;
        padding-right: 24px;
        border-radius: 7px;
        color: white;
        font-size: 16px;
        margin-right: 12px;

    }

       #Watch-btn{
        background-color: blueviolet;
        border: none;
        padding-top: 14px;
        padding-bottom: 14px;
        padding-left: 24px;
        padding-right: 24px;
        border-radius: 7px;
        color: white;
        font-size: 16px;

    }
    div{
        float: left;

    }
    img{
        float: right;
    }
</style>
<body>
    <header>
        <div>
            <h1>
                I am Peter
            </h1>
            <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. In similique alias velit quas repellendus. Maxime?</p>
            <button  id="Learn-btn">Learn More</button>
            <button id="Watch-btn">Watch More</button>

        </div>
        <img src="man.jpg" width="480" alt="">
    </header>
</body>
</html>
